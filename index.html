<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Write, edit, and publish new posts on The Macro Map, a blog on economics, geoeconomics, and geopolitics.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <title>Home | Macro Map</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="topbar topbar-tall">
        <div class="topbar-inner">
            <a class="brand" href="./index.html">Macro <span>Map</span></a>
            <nav>
                <ul class="nav">
                    <li><a href="./index.html" class="nav-link active"><i class="fa-solid fa-house"></i> Home</a></li>
                    <!-- <li><a href="./dashboard.html" class="nav-link"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li> -->
                    <li><a href="./profile.html" class="nav-link"><i class="fa-solid fa-user"></i> Profile</a></li>
                </ul>
            </nav>
            <div class="topbar-hero">
                <div class="hero-text">
                    <h1 class="page-heading">Latest posts</h1>
                    <p class="page-sub">Economics, geoeconomics and geopolitics.</p>
                </div>

                <form id="filterForm" class="filter-bar">
                    <input type="text" id="search" placeholder="Search blogs..." />
                    <select id="categoryFilter">
                        <option value="">All categories</option>

                        <optgroup label="Economics">
                            <option value="Macroeconomics">Macroeconomics</option>
                            <option value="Monetary Policy">Monetary Policy</option>
                            <option value="Fiscal Policy">Fiscal Policy</option>
                            <option value="Inflation & Prices">Inflation &amp; Prices</option>
                            <option value="Markets & Investing">Markets &amp; Investing</option>
                            <option value="Development Economics">Development Economics</option>
                            <option value="Africa & Nigeria">Africa &amp; Nigeria</option>
                        </optgroup>

                        <optgroup label="Geoeconomics">
                            <option value="Trade & Tariffs">Trade &amp; Tariffs</option>
                            <option value="Energy & Commodities">Energy &amp; Commodities</option>
                            <option value="Sanctions & Export Controls">Sanctions &amp; Export Controls</option>
                            <option value="Supply Chains">Supply Chains</option>
                            <option value="Currencies & Reserves">Currencies &amp; Reserves</option>
                            <option value="Debt & Global Finance">Debt &amp; Global Finance</option>
                        </optgroup>

                        <optgroup label="Geopolitics">
                            <option value="Conflict & Security">Conflict &amp; Security</option>
                            <option value="Great Power Rivalry">Great Power Rivalry</option>
                            <option value="Middle East">Middle East</option>
                            <option value="Elections & Politics">Elections &amp; Politics</option>
                            <option value="Regional Blocs & Alliances">Regional Blocs &amp; Alliances</option>
                        </optgroup>

                        <option value="Other">Other</option>
                    </select>
                    <button type="submit" class="btn btn-primary">Search</button>
                </form>
            </div>
        </div>
    </header>

    <main class="container">
        <section id="blogList" class="blog-list" aria-live="polite"></section>
    </main>

    <script src="./index.js" type="module"></script>
</body>
</html>
