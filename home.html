<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <title>Home | Macro Map</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="topbar topbar-tall">
        <div class="topbar-inner">
            <a class="brand" href="./home.html">Macro <span>Map</span></a>
            <nav>
                <ul class="nav">
                    <li><a href="./home.html" class="nav-link active"><i class="fa-solid fa-house"></i> Home</a></li>
                    <li><a href="./dashboard.html" class="nav-link"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
                    <li><a id="navLogout" onclick="handleLogout(event)" class="nav-link danger"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
                </ul>
            </nav>
            <div class="topbar-hero">
                <div class="hero-text">
                    <h1 class="page-heading">Latest posts</h1>
                    <p class="page-sub">Economics, geoeconomics and geopolitics.</p>
                </div>

                <form id="filterForm" class="filter-bar">
                    <input type="text" id="search" placeholder="Search blogs..." />
                    <select id="categoryFilter">
                        <option value="">All categories</option>
                        <option value="Technology">Technology</option>
                        <option value="Travel">Travel</option>
                        <option value="Lifestyle">Lifestyle</option>
                        <option value="Education">Education</option>
                        <option value="Other">Other</option>
                    </select>
                    <button type="submit" class="btn btn-primary">Search</button>
                </form>
            </div>
        </div>
    </header>
</body>
</html>
